<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99_Music - Your Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/utility.css">
</head>

<body>
    <div class="overlay"></div>
    <video autoplay muted loop id="bgVideo">
        <source src="../public/your-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="container flex bg-black">
        <div class="left ">
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo"><img src="../public/99_music_logo-removebg-preview.png" alt="" height="26px" width="29px">
                    <p>99Music</p>
                </div>
                <ul>
                    <li><i class="fa-solid fa-house"></i>Home</li>
                    <li class="search"><i class="fa-solid fa-magnifying-glass"></i>Search</li>
                </ul>
            </div>
            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <img src="../public/your_library-removebg-preview.png" height="40px" width="40px">
                    <h2>
                        Your Library
                    </h2>
                </div>
                <div class="playlist-con">
                    <div class="create-playlist">
                        <h3>Create your playlists</h3>
                        <p>Craft Your Perfect Playlist</p>
                        <button class="create-playlist-btn">Create playlists</button>

                        
                    </div>
                    <div class="create-playlist">
                        <h3>Add your favourite artist</h3>
                        <p>Curate Your Personal Collection</p>
                        <button class="create-playlist-btn">Add artists</button>

                    </div>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/in-en/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/in-en/safetyandprivacy/"><span>Safety &amp; Privacy
                                Center</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/in-en/legal/cookies-policy/"><span>Cookies</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3"><span>About Ads</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/in-en/accessibility/"><span>Accessibility</span></a>
                    </div>
                    <div class="lang-btn"></div>
                </div>
            </div>
        </div>
        <div class="right bg-grey rounded ">
            <div class="header rounded">
                <div class="nav">
                    <img class="invert" src="../public/leftarrows99(1)(1).png" height="20px">
                    <img class="invert" src="../public/rightarrows99(1)(1).png" height="20px">
                </div>
                <div class="search-container">
                    <input type="text" class="search-input bg-grey" placeholder="What’s your soundtrack today?">
                    <i class="fa-solid fa-magnifying-glass search-icon "></i>
                </div>
                
                <div class="buttons">
                    <button class="signupBtn">Sign up</button>
                    <button class="loginBtn">Log in</button>
                </div>
            </div>
            <div class="playlists">
                <div class="playlistWrapper">
                    <!-- Playlists will be appended here -->
                </div>
                <div class="gap-playbar">
                </div>
            </div>            
            <div class="playbar">
                <div class="songinfo"></div>
                <div class="songbuttons">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="45px" height="45px">
                        <defs>
                            <!-- Drop shadow filter for the arrow -->
                            <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                                <feOffset result="offOut" in="SourceAlpha" dx="2" dy="2" />
                                <feGaussianBlur result="blurOut" in="offOut" stdDeviation="2" />
                                <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
                            </filter>
                        </defs>
                    
                        <!-- Previous button arrow with drop shadow -->
                        <polygon points="60,30 30,50 60,70" fill="white" filter="url(#shadow)" />
                        <rect x="25" y="30" width="5" height="40" fill="white" filter="url(#shadow)" />
                    </svg>
                    
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="45px" height="45px">
                        <!-- Circle with enhanced gradient for 3D effect -->
                        <defs>
                            <!-- Outer circle gradient -->
                            <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                                <stop offset="0%" style="stop-color: #f2f2f2; stop-opacity: 1" />
                                <stop offset="50%" style="stop-color: #d9d9d9; stop-opacity: 1" />
                                <stop offset="100%" style="stop-color: #a0a0a0; stop-opacity: 1" />
                            </radialGradient>
                    
                            <!-- Inner shine for glossy look -->
                            <radialGradient id="shine" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
                                <stop offset="0%" style="stop-color: rgba(255, 255, 255, 0.7); stop-opacity: 1" />
                                <stop offset="100%" style="stop-color: rgba(255, 255, 255, 0); stop-opacity: 0" />
                            </radialGradient>
                    
                            <!-- Drop shadow filter for the play button -->
                            <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                                <feOffset result="offOut" in="SourceAlpha" dx="2" dy="2" />
                                <feGaussianBlur result="blurOut" in="offOut" stdDeviation="2" />
                                <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
                            </filter>
                    
                            <!-- Inner shadow filter for the circle -->
                            <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
                                <feComponentTransfer in="SourceAlpha">
                                    <feFuncA type="table" tableValues="1 0" />
                                </feComponentTransfer>
                                <feGaussianBlur stdDeviation="5" />
                                <feOffset dx="3" dy="3" result="offsetblur" />
                                <feFlood flood-color="black" result="color" />
                                <feComposite in2="offsetblur" operator="in" />
                                <feComposite in2="SourceAlpha" operator="in" />
                                <feMerge>
                                    <feMergeNode />
                                    <feMergeNode in="SourceGraphic" />
                                </feMerge>
                            </filter>
                        </defs>
                    
                        <!-- Outer Circle with enhanced gradient and inner shadow -->
                        <circle cx="50" cy="50" r="45" fill="url(#grad1)" filter="url(#innerShadow)" />
                    
                        <!-- Inner shine for glossy effect -->
                        <circle cx="50" cy="50" r="45" fill="url(#shine)" />
                    
                        <!-- Play button with drop shadow -->
                        <polygon points="35,25 75,50 35,75" fill="black" filter="url(#shadow)" />
                    </svg>

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="45px" height="45px">
                        <defs>
                            <!-- Drop shadow filter for the arrow -->
                            <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                                <feOffset result="offOut" in="SourceAlpha" dx="2" dy="2" />
                                <feGaussianBlur result="blurOut" in="offOut" stdDeviation="2" />
                                <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
                            </filter>
                        </defs>
                    
                        <!-- Next button arrow with drop shadow -->
                        <polygon points="40,30 70,50 40,70" fill="white" filter="url(#shadow)" />
                        <rect x="70" y="30" width="5" height="40" fill="white" filter="url(#shadow)" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- LOg In PAge -->

    <div class="login-page">
        <div class="login-content bg-grey">
            <div class="login-page-logo"><img src="../public/99_music_logo-removebg-preview.png" alt="" height="26px" width="29px">
            </div>
            <span>Hello Again!</span>
            <span class="login-close">&times;</span>
            <form action="/login" method="post">
                <label for="Email">Email*</label>
                <br>
                <input type="text" class="Email" name="Email" required><br><br>
                <label for="password">Password*</label>
                <br>
                <input type="password" id="password" name="password" required><br><br>
                <button type="submit">Login</button>

            </form>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
